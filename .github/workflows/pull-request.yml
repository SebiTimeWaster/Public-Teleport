name: Pull Request
run-name: Validate Pull Request
on: [pull_request]
jobs:
    duplicate-code:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: astubbs/duplicate-code-cross-check@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  directories: src
                  cpd-min-tokens: '30'
                  cpd-max-duplication: '3'
                  jscpd-min-lines: '2'
                  jscpd-min-tokens: '30'
                  jscpd-max-duplication: '3'
